        async function compressVideo(file, maxSeconds = 15) {
            return new Promise((resolve) => {
                if (!file.type.startsWith('video/')) return resolve(file);
                try {
                    const video = document.createElement('video');
                    video.src = URL.createObjectURL(file);
                    video.crossOrigin = 'anonymous';
                    video.playsInline = true;
                    video.muted = true; 
                    
                    video.onloadedmetadata = () => {
                        video.play().then(() => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 480; 
                            let scale = video.videoWidth > MAX_WIDTH ? MAX_WIDTH / video.videoWidth : 1;
                            canvas.width = video.videoWidth * scale;
                            canvas.height = video.videoHeight * scale;
                            const ctx = canvas.getContext('2d');

                            let stream;
                            if (canvas.captureStream) { stream = canvas.captureStream(30); } 
                            else { return resolve(file); }

                            let mime = 'video/webm; codecs=vp8';
                            if (!MediaRecorder.isTypeSupported(mime)) {
                                mime = 'video/webm';
                                if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4';
                            }

                            let recorder;
                            try { recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1500000 }); } 
                            catch(e) { return resolve(file); }

                            let chunks = [];
                            recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
                            recorder.onstop = () => {
                                video.pause(); URL.revokeObjectURL(video.src);
                                let blob = new Blob(chunks, { type: mime });
                                let ext = mime.includes('mp4') ? '.mp4' : '.webm';
                                let newFile = new File([blob], "video_optimizado" + ext, { type: mime });
                                if (newFile.size < 100) resolve(file); else resolve(newFile);
                            };

                            recorder.start();

                            let drawFrame = () => {
                                if (video.paused || video.ended) {
                                    if(recorder.state !== 'inactive') recorder.stop();
                                    return;
                                }
                                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                                requestAnimationFrame(drawFrame);
                            };
                            drawFrame();

                            setTimeout(() => { if(recorder.state !== 'inactive') recorder.stop(); }, maxSeconds * 1000);
                        }).catch(e => resolve(file));
                    };
                    video.onerror = () => resolve(file);
                } catch(e) { resolve(file); }
            });
        }

        async function compressImage(file) {
            return new Promise((resolve) => {
                if (!file.type.startsWith('image/')) { resolve(file); return; }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; let scale = 1;
                        if (img.width > MAX_WIDTH) { scale = MAX_WIDTH / img.width; }
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob(blob => {
                            if(blob) { resolve(new File([blob], file.name.replace(/\.[^/.]+$/, ".jpg"), { type: 'image/jpeg', lastModified: Date.now() })); } 
                            else { resolve(file); }
                        }, 'image/jpeg', 0.7); 
                    };
                    img.onerror = () => resolve(file);
                };
                reader.onerror = () => resolve(file);
            });
        }

                const userName = cUser ? cUser.replace(/[^a-zA-Z0-9]/g, '') : 'USER';
                const fileName = `${userName}/${Date.now()}-${safeName}.${ext}`;
                const { error } = await _supabase.storage.from('pediloya_comprobantes').upload(fileName, fileToUpload, { contentType: fileToUpload.type, upsert: true }); 
                if (error) { alert("Error Supabase: " + error.message); return null; } 
                return _supabase.storage.from('pediloya_comprobantes').getPublicUrl(fileName).data.publicUrl; 
            } catch(e) { alert("Error de red al subir."); return null; }
        }

                });
            }, options);
        }

        async function emitPendingTransferHTTP(urlRecibo) {
            if(!pendingTransferData) return;
            let val = pendingTransferData.amount;
            
            let motoSelected = qs('chofer-moto-select') ? qs('chofer-moto-select').value : null;
            let orderId = motoSelected ? 'TRK-' + motoSelected.replace(/\s+/g, '').toUpperCase() + '-' + Date.now().toString().slice(-3) : '';

            let desc = selProd ? `Venta: ${selProd.nombre}` : 'Venta de Mostrador'; 
            if(orderId) desc += ` [${orderId}]`; 

            let qtyToDeduct = selProd ? Math.max(1, Math.floor(val / selProd.precio)) : 0;
            
            mostrarTicketAnimado();

            await _supabase.from('pediloya_logs').insert([{ 
                local_id: currentLocalId, 
                tipo: 'VENTA', 
                metodo: 'TRANSFERENCIA', 
                monto: val, 
                fecha: getTucumanDateFE(), 
                hora: getTucumanTimeFE(), 
                descripcion: desc,
                moto_asignada: motoSelected,
                recibo_url: urlRecibo
            }]); 
            
            if(selProd && qtyToDeduct > 0) {
                let item = dbState.inventory.find(i => i.codigo === selProd.codigo);
                if(item) {
                    let newStock = Math.max(0, item.stock - qtyToDeduct);
                    await _supabase.from('pediloya_inventario').update({ stock: newStock }).eq('codigo', selProd.codigo);
                }
            }
            
            await loadDataFromDB(); 
            clearCalc();
            window.cerrarSheet();
            pendingTransferData = null;
            
            if(motoSelected && orderId) {
                alert(`✅ VENTA ASIGNADA A: ${motoSelected}\n📍 CÓDIGO GPS: ${orderId}\n\nEl sistema ya enlazó este código con el GPS de ${motoSelected}.`);
                setTimeout(() => compartirTRKWhatsApp(orderId), 800);
            } else {
                showToast("Venta registrada con foto.");
            }
        }

        async function cerrarTurno() {
            let calcCashMostrador = 0;
            let calcTransf = 0;
            let cashPorMoto = {};
            let totalEnMotos = 0;
            let hitCierre = false;

            dbState.logs.forEach(l => {
                if (hitCierre) return;
                if (l.tipo === 'CIERRE_TURNO' || (l.descripcion && l.descripcion.toUpperCase().includes('CIERRE DE TURNO'))) { hitCierre = true; return; }

                let pAmt = parseFloat(l.monto) || 0;
                let methodStr = (l.metodo || '').toUpperCase();
                
                if (l.tipo !== 'SISTEMA' && l.tipo !== 'GPS_DELI' && l.tipo !== 'PEDIDO_WEB' && l.tipo !== 'PEDIDO_WEB_OK') {
                    if (methodStr === 'EFECTIVO' || methodStr === 'DEBITO') {
                        if (l.tipo === 'VENTA' && l.moto_asignada) {
                            cashPorMoto[l.moto_asignada] = (cashPorMoto[l.moto_asignada] || 0) + pAmt;
                            totalEnMotos += pAmt;
                        } else if (l.tipo === 'RENDICION' && l.moto_asignada) {
                            cashPorMoto[l.moto_asignada] = (cashPorMoto[l.moto_asignada] || 0) - pAmt;
                            calcCashMostrador += pAmt; 
                            totalEnMotos -= pAmt;
                        } else {
                            calcCashMostrador += pAmt; 
                        }
                    } else if (methodStr === 'TRANSFERENCIA') {
                        calcTransf += pAmt;
                    }
                }
            });

            let retiroTotal = calcCashMostrador + totalEnMotos;

        function chequearOfertaRelampago() {
            if(flashTimerInterval) clearInterval(flashTimerInterval);
            let banner = qs('flash-sale-banner');
            if(!storeData.oferta_relampago) { if(banner) banner.classList.add('hidden'); return; }

            let endTime = new Date(storeData.oferta_relampago.fin).getTime();
            
            flashTimerInterval = setInterval(() => {
                let now = new Date().getTime();
                let distance = endTime - now;

                if (distance <= 0) {
                    clearInterval(flashTimerInterval);
                    if(banner) banner.classList.add('hidden');
                    return;
                }

                let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                let seconds = Math.floor((distance % (1000 * 60)) / 1000);
                
                setText('flash-sale-text', storeData.oferta_relampago.titulo);
                setText('flash-sale-timer', `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`);
                if(banner) banner.classList.remove('hidden');
            }, 1000);
        }

        window.guardarPlatoEnMenu = async function() {
            let name = qs('add-menu-name') ? qs('add-menu-name').value.trim() : ''; 
            let price = qs('add-menu-price') ? qs('add-menu-price').value.trim() : ''; 
            let stockVal = qs('add-menu-stock') ? (parseInt(qs('add-menu-stock').value.trim()) || 999) : 999;
            let desc = qs('add-menu-desc') ? qs('add-menu-desc').value.trim() : ''; 
            
            if(!name || !price) return alert("Nombre y precio obligatorios."); 
            if(!tempImgFile && !tempVidFile) return alert("Subí al menos una foto o video.");
            
            if(qs('btn-publicar-plato')) { setText('btn-publicar-plato', "PREPARANDO..."); qs('btn-publicar-plato').disabled = true; }

            try {
                let urlImg = ''; let urlVid = '';
                if(tempImgFile) { urlImg = await uploadFileDirect(tempImgFile); if(urlImg === null) throw new Error("Fallo foto"); }
                
                if(tempVidFile) { 
                    if(qs('btn-publicar-plato')) setText('btn-publicar-plato', "CORTANDO VIDEO (15s)...");
                    let processedVid = await compressVideo(tempVidFile, 15);
                    if(qs('btn-publicar-plato')) setText('btn-publicar-plato', "SUBIENDO...");
                    urlVid = await uploadFileDirect(processedVid); 
                    if(urlVid === null) throw new Error("Fallo video"); 
                }

        window.copiarTRK = function(trk) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(trk).then(() => {
                    showToast("Código " + trk + " copiado");
                });
            } else {
                let tempInput = document.createElement("input");
                tempInput.value = trk;
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand("copy");
                    showToast("Código " + trk + " copiado");
                } catch (err) {
                    showToast("Error al copiar", "error");
                }
                document.body.removeChild(tempInput);
            }
        };

            if(!select || !select.value) return showToast("Seleccioná un repartidor primero", "error");
            
            let motoName = select.value;
            
            await _supabase.from('pediloya_logs').update({ moto_asignada: motoName }).eq('id', logId);
            
            copiarTRK(trkCode);
            
            showToast(`Moto ${motoName} asignada. TRK copiado.`);
            await loadDataFromDB(); 
        }

            if (navigator.share) {

        async function enviarPedido(metodo) {
            let dir = qs('order-address') ? qs('order-address').value.trim() : ''; 
            if(isDeliveryOption && !dir) return showToast("Completá tu dirección.", "error");
            let notes = qs('order-notes') ? qs('order-notes').value.trim() : '';
            
            let totalBruto = shoppingCart.reduce((sum, item) => sum + parseFloat(item.precio), 0); 
            let descuento = 0;
            if(cupoAplicado) {
                descuento = cupoAplicado.tipo === 'monto' ? parseFloat(cupoAplicado.val) : totalBruto * (parseFloat(cupoAplicado.val) / 100);
            }
            let totalFinal = Math.max(0, totalBruto - descuento);

            let orderId = 'TRK' + Date.now().toString().slice(-5);
            let dirFinal = isDeliveryOption ? dir : "RETIRO EN LOCAL";
            let cuponInfo = cupoAplicado ? `\n🎟️ Cupón: [${cupoAplicado.codigo}] (-$${descuento.toLocaleString('es-AR')})` : '';
            let desc = `NUEVO PEDIDO [${orderId}]\nDir: ${dirFinal}${cuponInfo}\nNotas: ${notes}\nDetalle:\n`; 
            
            let itemsCount = {}; shoppingCart.forEach(i => { itemsCount[i.nombre] = (itemsCount[i.nombre]||0)+1; });
            for (let [nombre, qty] of Object.entries(itemsCount)) { desc += `- ${qty}x ${nombre}\n`; } 
            
            for (let [nombre, qty] of Object.entries(itemsCount)) {
                let p = menuItems.find(x => x.nombre === nombre);
                if(p) { let nuevoStock = Math.max(0, p.stock - qty); await _supabase.from('pediloya_inventario').update({ stock: nuevoStock }).eq('codigo', p.codigo); }
            }

            await _supabase.from('pediloya_logs').insert([{ local_id: targetLocalId, tipo: 'PEDIDO_WEB', metodo: metodo, monto: totalFinal, fecha: getTucumanDateFE(), hora: getTucumanTimeFE(), descripcion: desc }]);
            
            if(qs('modal-carrito')) qs('modal-carrito').style.display = 'none'; 
            shoppingCart = []; 
            let cupoUsado = cupoAplicado ? cupoAplicado.codigo : null;
            cupoAplicado = null; 
            if(qs('cart-coupon-input')) qs('cart-coupon-input').value = '';
            updateCartUI();
            
            let num = targetLocalPhone ? String(targetLocalPhone).replace(/\D/g, '') : '';
            if(num.length === 10) num = '549' + num;
            if(num) {
                let trackLink = `${window.location.origin}/?track=${orderId}&local=${encodeURIComponent(targetLocalName)}`;
                let msgWa = `*¡NUEVO PEDIDO WEB!* 🛵\n\n*Total:* $${totalFinal.toLocaleString('es-AR')}${cupoUsado ? ` _(Cupón ${cupoUsado} aplicado)_` : ''}\n*Pago:* ${metodo}\n*Dirección:* ${dirFinal}\n\n*Detalle:*\n`; 
                for (let [nombre, qty] of Object.entries(itemsCount)) { msgWa += `- ${qty}x ${nombre}\n`; } 
                msgWa += `\n*Aclaraciones:* ${notes}\n\n*Link Rastreo:* ${trackLink}`; 
                window.open(`https://wa.me/${num}?text=${encodeURIComponent(msgWa)}`, '_blank');
            }

            let overlay = qs('order-success-overlay');
            if(overlay) {
                overlay.classList.remove('hidden');
                overlay.style.display = 'flex';
                setTimeout(() => {
                    switchCustomerTab('track', document.querySelectorAll('.nav-item')[1]); 
                    if(qs('track-input-code')) qs('track-input-code').value = orderId; 
                    iniciarRastreoClienteManual();
                    overlay.style.display = 'none'; overlay.classList.add('hidden');

            }

        window.toggleDriverGps = function() {
            let btn = qs('btn-gps');
            let selectMoto = qs('chofer-moto-select');
            
            if(!btn) return;
            
            if (!selectMoto || selectMoto.value === "") {
                showToast("⚠️ Seleccioná tu moto en la caja antes de prender el GPS", "error");
                return;
            }

            if (!navigator.geolocation) {
                showToast("⚠️ Tu celular no soporta GPS o el navegador lo bloquea.", "error");
                return;
            }

            isGpsActive = !isGpsActive;
            
            if(isGpsActive) {
                btn.style.background = 'var(--success)';
                btn.style.borderColor = 'var(--success)';
                btn.style.color = 'white';
                btn.innerText = "📍 GPS ACTIVO";
                showToast(`GPS Conectado para ${selectMoto.value}...`, "success");
                
                enviarUbicacionGPS(); // Manda la primera de inmediato
                gpsInterval = setInterval(enviarUbicacionGPS, 10000); // Actualiza cada 10 seg
            } else {
                btn.style.background = 'var(--text-dark)';
                btn.style.borderColor = 'var(--text-dark)';
                btn.innerText = "📍 GPS DELI";
                if(gpsInterval) clearInterval(gpsInterval);
                showToast("GPS Apagado", "info");
            }
        };

        window.enviarUbicacionGPS = async function() {
            let miNombreMoto = qs('chofer-moto-select') ? qs('chofer-moto-select').value : 'MOTO_GENERICA';
            
            navigator.geolocation.getCurrentPosition(async (pos) => {
                let lat = pos.coords.latitude;
                let lon = pos.coords.longitude;
                let coordsStr = JSON.stringify({lat, lon});
                
                await _supabase.from('pediloya_logs').delete().eq('local_id', currentLocalId).eq('tipo', 'GPS_DELI').eq('moto_asignada', miNombreMoto);
                
                await _supabase.from('pediloya_logs').insert([{
                    local_id: currentLocalId,
                    tipo: 'GPS_DELI',
                    metodo: 'SISTEMA',
                    monto: 0,
                    fecha: getTucumanDateFE(),
                    hora: getTucumanTimeFE(),
                    descripcion: coordsStr,
                    moto_asignada: miNombreMoto
                }]);
            }, (err) => {
                console.log("Error GPS", err);
                showToast("⚠️ Error de GPS. Activá la ubicación en tu celular.", "error");
                
                // Si falla, apagar el botón visualmente para no confundir
                if(isGpsActive) {
                    isGpsActive = false;
                    if(gpsInterval) clearInterval(gpsInterval);
                    let btn = qs('btn-gps');
                    if(btn) {
                        btn.style.background = 'var(--text-dark)';
                        btn.style.borderColor = 'var(--text-dark)';
                        btn.innerText = "📍 GPS DELI";
                    }
                }
            }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }); // Se fuerza la máxima precisión
        };

            if(!trackCode || !localName) return;

            if(!targetLocalId) {
                let { data: usr } = await _supabase.from('pediloya_usuarios').select('id, whatsapp, app_data').eq('local', localBusqueda).maybeSingle();

            let { data: pedidos } = await _supabase.from('pediloya_logs')
                .select('*')
                .eq('local_id', targetLocalId)
                .like('descripcion', `%${trackCode}%`);

            let motoDelPedido = null;
            if (pedidos && pedidos.length > 0) {
                let pedidoEncontrado = pedidos.find(p => p.moto_asignada != null);
                if (pedidoEncontrado) motoDelPedido = pedidoEncontrado.moto_asignada;
            }

            if (!motoDelPedido) {
                setText('track-status-text', 'Preparando pedido 🍔');
                setText('track-detail-text', 'Tu pedido se está preparando. Aún no salió.');
                updateLiveMap(-26.8241, -65.2226, 'tracking-map-container', false);
                return;
            }

            setText('track-status-text', `Buscando a ${motoDelPedido}...`);

            let { data: gpsData } = await _supabase.from('pediloya_logs')
                .select('descripcion, hora')
                .eq('local_id', targetLocalId)
                .eq('tipo', 'GPS_DELI')
                .eq('moto_asignada', motoDelPedido) 
                .order('created_at', { ascending: false })
                .limit(1)
                .maybeSingle();

            let initialLat = -26.8241;
            let initialLon = -65.2226;

            if (gpsData && gpsData.descripcion) {
                try {
                    let coords = JSON.parse(gpsData.descripcion);
                    initialLat = coords.lat;

            } else {

                setText('track-detail-text', 'Esperando GPS del repartidor.');
            }

            updateLiveMap(initialLat, initialLon, 'tracking-map-container', false);

            if(gpsSubscription) {
                _supabase.removeChannel(gpsSubscription);
            }

            gpsSubscription = _supabase.channel('public:pediloya_logs:gps_cliente')
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'pediloya_logs', 
                    filter: `local_id=eq.${targetLocalId}` 
                }, payload => {
                    if(payload.new.tipo === 'GPS_DELI' && payload.new.moto_asignada === motoDelPedido) {

                            updateLiveMap(coords.lat, coords.lon, 'tracking-map-container', false);
                            setText('track-status-text', `🛵 ${motoDelPedido} en movimiento`);
                            setText('track-detail-text', `Ubicación en vivo (${payload.new.hora})`);
                        } catch(e) {}
                    }
                }).subscribe();
        };

        async function compressVideo(file, maxSeconds = 15) {
            return new Promise((resolve) => {
                if (!file.type.startsWith('video/')) return resolve(file);
                try {
                    const video = document.createElement('video');
                    video.src = URL.createObjectURL(file);
                    video.crossOrigin = 'anonymous';
                    video.playsInline = true;
                    video.muted = true; 
                    
                    video.onloadedmetadata = () => {
                        video.play().then(() => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 480; 
                            let scale = video.videoWidth > MAX_WIDTH ? MAX_WIDTH / video.videoWidth : 1;
                            canvas.width = video.videoWidth * scale;
                            canvas.height = video.videoHeight * scale;
                            const ctx = canvas.getContext('2d');

                            let stream;
                            if (canvas.captureStream) { stream = canvas.captureStream(30); } 
                            else { return resolve(file); }

                            let mime = 'video/webm; codecs=vp8';
                            if (!MediaRecorder.isTypeSupported(mime)) {
                                mime = 'video/webm';
                                if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4';
                            }

                            let recorder;
                            try { recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1500000 }); } 
                            catch(e) { return resolve(file); }

                            let chunks = [];
                            recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
                            recorder.onstop = () => {
                                video.pause(); URL.revokeObjectURL(video.src);
                                let blob = new Blob(chunks, { type: mime });
                                let ext = mime.includes('mp4') ? '.mp4' : '.webm';
                                let newFile = new File([blob], "video_optimizado" + ext, { type: mime });
                                if (newFile.size < 100) resolve(file); else resolve(newFile);
                            };

                            recorder.start();

                            let drawFrame = () => {
                                if (video.paused || video.ended) {
                                    if(recorder.state !== 'inactive') recorder.stop();
                                    return;
                                }
                                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                                requestAnimationFrame(drawFrame);
                            };
                            drawFrame();

                            setTimeout(() => { if(recorder.state !== 'inactive') recorder.stop(); }, maxSeconds * 1000);
                        }).catch(e => resolve(file));
                    };
                    video.onerror = () => resolve(file);
                } catch(e) { resolve(file); }
            });
        }

        async function compressImage(file) {
            return new Promise((resolve) => {
                if (!file.type.startsWith('image/')) { resolve(file); return; }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; let scale = 1;
                        if (img.width > MAX_WIDTH) { scale = MAX_WIDTH / img.width; }
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob(blob => {
                            if(blob) { resolve(new File([blob], file.name.replace(/\.[^/.]+$/, ".jpg"), { type: 'image/jpeg', lastModified: Date.now() })); } 
                            else { resolve(file); }
                        }, 'image/jpeg', 0.7); 
                    };
                    img.onerror = () => resolve(file);
                };
                reader.onerror = () => resolve(file);
            });
        }

        async function emitPendingTransferHTTP(urlRecibo) {
            if(!pendingTransferData) return;
            let val = pendingTransferData.amount;
            
            let motoSelected = qs('chofer-moto-select') ? qs('chofer-moto-select').value : null;
            let orderId = motoSelected ? 'TRK-' + motoSelected.replace(/\s+/g, '').toUpperCase() + '-' + Date.now().toString().slice(-3) : '';

            let desc = selProd ? `Venta: ${selProd.nombre}` : 'Venta de Mostrador'; 
            if(orderId) desc += ` [${orderId}]`; 

            let qtyToDeduct = selProd ? Math.max(1, Math.floor(val / selProd.precio)) : 0;
            
            mostrarTicketAnimado();

            await _supabase.from('pediloya_logs').insert([{ 
                local_id: currentLocalId, 
                tipo: 'VENTA', 
                metodo: 'TRANSFERENCIA', 
                monto: val, 
                fecha: getTucumanDateFE(), 
                hora: getTucumanTimeFE(), 
                descripcion: desc,
                moto_asignada: motoSelected,
                recibo_url: urlRecibo
            }]); 
            
            if(selProd && qtyToDeduct > 0) {
                let item = dbState.inventory.find(i => i.codigo === selProd.codigo);
                if(item) {
                    let newStock = Math.max(0, item.stock - qtyToDeduct);
                    await _supabase.from('pediloya_inventario').update({ stock: newStock }).eq('codigo', selProd.codigo);
                }
            }
            
            await loadDataFromDB(); 
            clearCalc();
            window.cerrarSheet();
            pendingTransferData = null;
            
            if(motoSelected && orderId) {
                alert(`✅ VENTA ASIGNADA A: ${motoSelected}\n📍 CÓDIGO GPS: ${orderId}\n\nEl sistema ya enlazó este código con el GPS de ${motoSelected}.`);
                setTimeout(() => compartirTRKWhatsApp(orderId), 800);
            } else {
                showToast("Venta registrada con foto.");
            }
        }

        window.processTransferWithPhoto = function(e) { 
            const f = e.target.files[0]; 
            if(!f) return; 
            
            if(isPaywallUpload) {
                let imgEl = qs('ai-receipt-img');
                if(imgEl) imgEl.src = URL.createObjectURL(f);
            } else if (pendingTransferData) {
                setText('calc-preview', "SUBIENDO TICKET...");
            }

            const r = new FileReader(); 
            r.readAsDataURL(f); 
            r.onload = ev => { 
                const img = new Image(); 
                img.src = ev.target.result; 
                img.onload = async () => { 
                    const c = document.createElement('canvas'); 
                    let targetWidth = 800; 
                    let scale = targetWidth / img.width; 
                    if(scale > 1) scale = 1;
                    c.width = img.width * scale; 
                    c.height = img.height * scale; 
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); 
                    let base64 = c.toDataURL('image/jpeg', 0.65); 
                    
                    if (isPaywallUpload) { 
                        ejecutarValidacionPaywallIA(base64); 
                    } else if (pendingTransferData && pendingTransferData.type === 'SALE_TRANSF') {
                        let urlLiviana = await uploadFileDirect(f);
                        setText('calc-preview', "");
                        emitPendingTransferHTTP(urlLiviana);
                    }
                } 
            } 
        }

        async function cerrarTurno() {
            let calcCashMostrador = 0;
            let calcTransf = 0;
            let cashPorMoto = {};
            let totalEnMotos = 0;
            let hitCierre = false;

            dbState.logs.forEach(l => {
                if (hitCierre) return;
                if (l.tipo === 'CIERRE_TURNO' || (l.descripcion && l.descripcion.toUpperCase().includes('CIERRE DE TURNO'))) { hitCierre = true; return; }

                let pAmt = parseFloat(l.monto) || 0;
                let methodStr = (l.metodo || '').toUpperCase();
                
                if (l.tipo !== 'SISTEMA' && l.tipo !== 'GPS_DELI' && l.tipo !== 'PEDIDO_WEB' && l.tipo !== 'PEDIDO_WEB_OK') {
                    if (methodStr === 'EFECTIVO' || methodStr === 'DEBITO') {
                        if (l.tipo === 'VENTA' && l.moto_asignada) {
                            cashPorMoto[l.moto_asignada] = (cashPorMoto[l.moto_asignada] || 0) + pAmt;
                            totalEnMotos += pAmt;
                        } else if (l.tipo === 'RENDICION' && l.moto_asignada) {
                            cashPorMoto[l.moto_asignada] = (cashPorMoto[l.moto_asignada] || 0) - pAmt;
                            calcCashMostrador += pAmt; 
                            totalEnMotos -= pAmt;
                        } else {
                            calcCashMostrador += pAmt; 
                        }
                    } else if (methodStr === 'TRANSFERENCIA') {
                        calcTransf += pAmt;
                    }
                }
            });

            let retiroTotal = calcCashMostrador + totalEnMotos;

            let htmlBreakdown = `
            <div style="background: #1e293b; padding: 24px; border-radius: 20px; margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.05);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; font-size:1.15rem;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-size:1.3rem;">🏪</span>
                        <span style="color:#94a3b8; font-weight:600; line-height:1.2;">Mostrador<br><span style="font-size:0.85rem;">(Caja)</span></span>
                    </div>
                    <span style="color:white; font-weight:900; font-family:'Outfit'; font-size:1.3rem;">$${calcCashMostrador.toLocaleString('es-AR')}</span>
                </div>`;
            
            let motoMsgText = "";
            for (let moto in cashPorMoto) {
                htmlBreakdown += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; font-size:1.15rem;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-size:1.3rem;">🛵</span>
                        <span style="color:#94a3b8; font-weight:600; line-height:1.2;">Repartidor<br><span style="font-size:0.85rem;">${moto}</span></span>
                    </div>
                    <span style="color:var(--primary-orange); font-weight:900; font-family:'Outfit'; font-size:1.3rem;">$${cashPorMoto[moto].toLocaleString('es-AR')}</span>
                </div>`;
                motoMsgText += `\n🛵 *${moto}:* $${cashPorMoto[moto].toLocaleString('es-AR')}`;
            }
            
            htmlBreakdown += `
                <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 16px 0;"></div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; font-size:1.15rem;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-size:1.3rem;">🏦</span>
                        <span style="color:#94a3b8; font-weight:600; line-height:1.2;">Transferencias<br><span style="font-size:0.85rem;">(No físicas)</span></span>
                    </div>
                    <span style="color:#38bdf8; font-weight:900; font-family:'Outfit'; font-size:1.3rem;">$${calcTransf.toLocaleString('es-AR')}</span>
                </div>
                
                <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 20px 0;"></div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="color:white; font-weight:800; text-transform:uppercase; font-size:0.95rem; line-height:1.2;">EFECTIVO A<br>RETIRAR<br>TOTAL</span>
                    <span style="color:#10b981; font-weight:900; font-size:2.2rem; font-family:'Outfit';">$${retiroTotal.toLocaleString('es-AR')}</span>
                </div>
            </div>`;

            setHtml('cierre-breakdown', htmlBreakdown);

        function parseUrlsSeguro(foto_url) {
            let img = '', vid = '';
            if(foto_url) {
                if(foto_url.includes('|')) { let parts = foto_url.split('|'); img = parts[0] || ''; vid = parts[1] || ''; } 
                else { if(foto_url.includes('.mp4') || foto_url.includes('.webm')) vid = foto_url; else img = foto_url; }
            }
            return { img, vid, hasVideo: !!vid, hasImg: !!img };
        }

        window.guardarPlatoEnMenu = async function() {
            let name = qs('add-menu-name') ? qs('add-menu-name').value.trim() : ''; 
            let price = qs('add-menu-price') ? qs('add-menu-price').value.trim() : ''; 
            let stockVal = qs('add-menu-stock') ? (parseInt(qs('add-menu-stock').value.trim()) || 999) : 999;
            let desc = qs('add-menu-desc') ? qs('add-menu-desc').value.trim() : ''; 
            
            if(!name || !price) return alert("Nombre y precio obligatorios."); 
            if(!tempImgFile && !tempVidFile) return alert("Subí al menos una foto o video.");
            
            if(qs('btn-publicar-plato')) { setText('btn-publicar-plato', "PREPARANDO..."); qs('btn-publicar-plato').disabled = true; }

            try {
                let urlImg = ''; let urlVid = '';
                if(tempImgFile) { urlImg = await uploadFileDirect(tempImgFile); if(urlImg === null) throw new Error("Fallo foto"); }
                
                if(tempVidFile) { 
                    if(qs('btn-publicar-plato')) setText('btn-publicar-plato', "CORTANDO VIDEO (15s)...");
                    let processedVid = await compressVideo(tempVidFile, 15);
                    if(qs('btn-publicar-plato')) setText('btn-publicar-plato', "SUBIENDO...");
                    urlVid = await uploadFileDirect(processedVid); 
                    if(urlVid === null) throw new Error("Fallo video"); 
                }
                
                let combinedUrl = (urlImg || '') + '|' + (urlVid || '');
                let finalCode = 'PLATO-' + Date.now().toString().slice(-4);

                await _supabase.from('pediloya_inventario').upsert([{ local_id: currentLocalId, codigo: finalCode, nombre: name, precio: parseFloat(price) || 0, stock: stockVal, unidad: 'mixto', descripcion: desc, foto_url: combinedUrl }]);
                await loadDataFromDB();
                
                setVal('add-menu-name',''); setVal('add-menu-price',''); setVal('add-menu-stock',''); setVal('add-menu-desc',''); 
                tempImgFile = null; tempVidFile = null;
                if(qs('img-plato-preview')) qs('img-plato-preview').style.display='none'; 
                if(qs('vid-plato-preview')) qs('vid-plato-preview').style.display='none';

                if(qs('placeholder-plato-vid')) qs('placeholder-plato-vid').style.display='flex'; 
                showToast("Plato publicado."); 
            } catch(e) { showToast("La subida falló.", "error"); }
            
            if(qs('btn-publicar-plato')) { setText('btn-publicar-plato', "PUBLICAR PLATO"); qs('btn-publicar-plato').disabled = false; }
        }

        window.copiarTRK = function(trk) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(trk).then(() => {
                    showToast("Código " + trk + " copiado");
                });
            } else {
                let tempInput = document.createElement("input");
                tempInput.value = trk;
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand("copy");
                    showToast("Código " + trk + " copiado");
                } catch (err) {
                    showToast("Error al copiar", "error");
                }
                document.body.removeChild(tempInput);
            }
        };

            let motoName = select.value;
            
            await _supabase.from('pediloya_logs').update({ moto_asignada: motoName }).eq('id', logId);
            
            copiarTRK(trkCode);
            
            showToast(`Moto ${motoName} asignada. TRK copiado.`);
            await loadDataFromDB(); 
        }

        async function enviarPedido(metodo) {
            let dir = qs('order-address') ? qs('order-address').value.trim() : ''; 
            if(isDeliveryOption && !dir) return showToast("Completá tu dirección.", "error");
            let notes = qs('order-notes') ? qs('order-notes').value.trim() : '';
            
            let totalBruto = shoppingCart.reduce((sum, item) => sum + parseFloat(item.precio), 0); 
            let descuento = 0;
            if(cupoAplicado) {
                descuento = cupoAplicado.tipo === 'monto' ? parseFloat(cupoAplicado.val) : totalBruto * (parseFloat(cupoAplicado.val) / 100);
            }
            let totalFinal = Math.max(0, totalBruto - descuento);

            let orderId = 'TRK' + Date.now().toString().slice(-5);
            let dirFinal = isDeliveryOption ? dir : "RETIRO EN LOCAL";
            let cuponInfo = cupoAplicado ? `\n🎟️ Cupón: [${cupoAplicado.codigo}] (-$${descuento.toLocaleString('es-AR')})` : '';
            let desc = `NUEVO PEDIDO [${orderId}]\nDir: ${dirFinal}${cuponInfo}\nNotas: ${notes}\nDetalle:\n`; 
            
            let itemsCount = {}; shoppingCart.forEach(i => { itemsCount[i.nombre] = (itemsCount[i.nombre]||0)+1; });
            for (let [nombre, qty] of Object.entries(itemsCount)) { desc += `- ${qty}x ${nombre}\n`; } 
            
            for (let [nombre, qty] of Object.entries(itemsCount)) {
                let p = menuItems.find(x => x.nombre === nombre);
                if(p) { let nuevoStock = Math.max(0, p.stock - qty); await _supabase.from('pediloya_inventario').update({ stock: nuevoStock }).eq('codigo', p.codigo); }
            }

            await _supabase.from('pediloya_logs').insert([{ local_id: targetLocalId, tipo: 'PEDIDO_WEB', metodo: metodo, monto: totalFinal, fecha: getTucumanDateFE(), hora: getTucumanTimeFE(), descripcion: desc }]);
            
            if(qs('modal-carrito')) qs('modal-carrito').style.display = 'none'; 
            shoppingCart = []; 
            let cupoUsado = cupoAplicado ? cupoAplicado.codigo : null;
            cupoAplicado = null; 
            if(qs('cart-coupon-input')) qs('cart-coupon-input').value = '';
            updateCartUI();
            
            let num = targetLocalPhone ? String(targetLocalPhone).replace(/\D/g, '') : '';
            if(num.length === 10) num = '549' + num;
            if(num) {
                let trackLink = `${window.location.origin}/?track=${orderId}&local=${encodeURIComponent(targetLocalName)}`;
                let msgWa = `*¡NUEVO PEDIDO WEB!* 🛵\n\n*Total:* $${totalFinal.toLocaleString('es-AR')}${cupoUsado ? ` _(Cupón ${cupoUsado} aplicado)_` : ''}\n*Pago:* ${metodo}\n*Dirección:* ${dirFinal}\n\n*Detalle:*\n`; 
                for (let [nombre, qty] of Object.entries(itemsCount)) { msgWa += `- ${qty}x ${nombre}\n`; } 
                msgWa += `\n*Aclaraciones:* ${notes}\n\n*Link Rastreo:* ${trackLink}`; 
                window.open(`https://wa.me/${num}?text=${encodeURIComponent(msgWa)}`, '_blank');
            }

            let overlay = qs('order-success-overlay');
            if(overlay) {
                overlay.classList.remove('hidden');
                overlay.style.display = 'flex';
                setTimeout(() => {
                    switchCustomerTab('track', document.querySelectorAll('.nav-item')[1]); 
                    if(qs('track-input-code')) qs('track-input-code').value = orderId; 
                    iniciarRastreoClienteManual();
                    overlay.style.display = 'none'; overlay.classList.add('hidden');
                }, 2500); 
            } else {
                switchCustomerTab('track', document.querySelectorAll('.nav-item')[1]); 
                if(qs('track-input-code')) qs('track-input-code').value = orderId; 
                iniciarRastreoClienteManual();
            }
        }

        function inputCalc(val) { if(expr.length > 20) return; if(isEval && !['+','-','×','÷'].includes(val)) { expr = ""; isEval = false; selProd = null; } expr += val; setText('calc-preview', expr.replace(/\*/g, '×').replace(/\//g, '÷')); let temp = eval(expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/[+\-*/]$/, '')); setText('calc-total', temp !== undefined ? temp : expr); }
        function evalCalc() { let res = eval(expr.replace(/×/g, '*').replace(/÷/g, '/'))||0; setText('calc-total', res); expr = res.toString(); setText('calc-preview', selProd ? `${selProd.nombre} | $${res}` : ""); isEval = true; }
        function deleteCalc() { expr = expr.slice(0, -1); setText('calc-preview', expr); setText('calc-total', eval(expr.replace(/×/g, '*'))||0); selProd = null; }

        window.submitSale = async function(metodo) {
            let val = getCalcValue(); 
            if(val <= 0) { showToast("Ingresá un monto mayor a 0", "error"); return; }
            
            let desc = selProd ? `Venta: ${selProd.nombre}` : 'Venta de Mostrador'; 
            let motoSelected = qs('chofer-moto-select') ? qs('chofer-moto-select').value : null;
            let qtyToDeduct = selProd ? Math.max(1, Math.floor(val / selProd.precio)) : 0;
            
            mostrarTicketAnimado();

            await _supabase.from('pediloya_logs').insert([{ 
                local_id: currentLocalId, 
                tipo: 'VENTA', 
                metodo: metodo, 
                monto: val, 
                fecha: getTucumanDateFE(), 
                hora: getTucumanTimeFE(), 
                descripcion: desc,
                moto_asignada: motoSelected
            }]); 
            
            if(selProd && qtyToDeduct > 0) {
                let item = dbState.inventory.find(i => i.codigo === selProd.codigo);
                if(item) {
                    let newStock = Math.max(0, item.stock - qtyToDeduct);
                    await _supabase.from('pediloya_inventario').update({ stock: newStock }).eq('codigo', selProd.codigo);
                }
            }
            
            await loadDataFromDB(); 
            clearCalc();
            showToast("Venta registrada.");
        }

            let msg = `Seguí en vivo tu pedido de *${cUser}* desde este enlace de rastreo oficial: ${link}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.compartirTRKWhatsApp = function(trk) {
            let link = window.location.origin + '/?local=' + encodeURIComponent(cUser) + '&track=' + trk;
            let msg = '🛵 Sigue tu pedido de *' + cUser + '* en vivo aquí:\n\n📍 ' + link;
            window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
        };

        // ============================================
        // LÓGICA DE GPS DEL CADETE CORREGIDA Y BLINDADA
        // ============================================
        window.toggleDriverGps = function() {
            let btn = qs('btn-gps');
            let selectMoto = qs('chofer-moto-select');
            
            if(!btn) return;
            
            if (!selectMoto || selectMoto.value === "") {
                showToast("⚠️ Seleccioná tu moto en la caja antes de prender el GPS", "error");
                return;
            }

            if (!navigator.geolocation) {
                showToast("⚠️ Tu celular no soporta GPS o el navegador lo bloquea.", "error");
                return;
            }

            isGpsActive = !isGpsActive;
            
            if(isGpsActive) {
                btn.style.background = 'var(--success)';
                btn.style.borderColor = 'var(--success)';
                btn.style.color = 'white';
                btn.innerText = "📍 GPS ACTIVO";
                showToast(`GPS Conectado para ${selectMoto.value}...`, "success");
                
                enviarUbicacionGPS(); 
                gpsInterval = setInterval(enviarUbicacionGPS, 10000); 
            } else {
                btn.style.background = 'var(--text-dark)';
                btn.style.borderColor = 'var(--text-dark)';
                btn.innerText = "📍 GPS DELI";
                if(gpsInterval) clearInterval(gpsInterval);
                showToast("GPS Apagado", "info");
            }
        };

        window.enviarUbicacionGPS = async function() {
            let miNombreMoto = qs('chofer-moto-select') ? qs('chofer-moto-select').value : 'MOTO_GENERICA';
            
            navigator.geolocation.getCurrentPosition(async (pos) => {
                let lat = pos.coords.latitude;
                let lon = pos.coords.longitude;
                let coordsStr = JSON.stringify({lat, lon});
                
                await _supabase.from('pediloya_logs').delete().eq('local_id', currentLocalId).eq('tipo', 'GPS_DELI').eq('moto_asignada', miNombreMoto);
                
                await _supabase.from('pediloya_logs').insert([{
                    local_id: currentLocalId,
                    tipo: 'GPS_DELI',
                    metodo: 'SISTEMA',
                    monto: 0,
                    fecha: getTucumanDateFE(),
                    hora: getTucumanTimeFE(),
                    descripcion: coordsStr,
                    moto_asignada: miNombreMoto
                }]);
            }, (err) => {
                console.log("Error GPS", err);
                showToast("⚠️ Error de GPS. Activá la ubicación en tu celular.", "error");
                
                if(isGpsActive) {
                    isGpsActive = false;
                    if(gpsInterval) clearInterval(gpsInterval);
                    let btn = qs('btn-gps');
                    if(btn) {
                        btn.style.background = 'var(--text-dark)';
                        btn.style.borderColor = 'var(--text-dark)';
                        btn.innerText = "📍 GPS DELI";
                    }
                }
            }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }); 
        };
        
        function abrirRadarDueno() { if(qs('modal-radar-owner')) qs('modal-radar-owner').style.display='flex'; actualizarRadarMap(); setTimeout(actualizarRadarMap, 500); }
        async function actualizarRadarMap() { showToast("Buscando GPS...", "info"); let { data } = await _supabase.from('pediloya_logs').select('descripcion').eq('local_id', currentLocalId).eq('tipo', 'GPS_DELI').order('created_at', {ascending: false}).limit(1).maybeSingle(); if(data) { try { let coords = JSON.parse(data.descripcion); updateLiveMap(coords.lat, coords.lon, 'radar-owner-map-container', true); showToast("Actualizado"); } catch(e) {} } }
        
        function pausarVideoQuickView() { let vids = document.querySelectorAll('#qv-media video'); vids.forEach(v => v.pause()); }

        window.abrirModalMotos = function() {
            if(qs('motos-modal')) qs('motos-modal').style.display = 'flex';
            renderMotosModal();
        };

        function renderMotosModal() {
            let totalMotos = window.currentTotalEnMotos || 0;
            setText('motos-total-text', '$' + totalMotos.toLocaleString('es-AR'));

            let html = '';
            let cashPorMoto = window.currentCashPorMoto || {};

            dbState.repartidores.forEach(m => {
                let aRendir = cashPorMoto[m.nombre] || 0;
                html += `
                    <div style="background:var(--bg-pure); border:1px solid var(--border-soft); border-radius:16px; padding:16px; margin-bottom: 12px; display:flex; justify-content:space-between; align-items:center; box-shadow:var(--shadow-soft);">
                        <div>
                            <h4 style="margin:0 0 4px; font-size:1.1rem; color:var(--text-dark); font-family:'Outfit';">🛵 ${m.nombre}</h4>
                            <span style="font-size:0.85rem; color:var(--text-gray); font-weight:600;">Efectivo a rendir</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <span style="font-size:1.4rem; font-weight:800; font-family:'Outfit'; color:var(--primary-orange);">$${aRendir.toLocaleString('es-AR')}</span>
                            <button onclick="vibrar([40]); rendirPlataMoto('${m.nombre}', ${aRendir})" style="background:var(--success); color:white; border:none; padding:10px 14px; border-radius:12px; font-weight:bold; cursor:pointer; box-shadow:0 4px 10px rgba(16,185,129,0.3);">RECIBIR</button>
                        </div>
                    </div>
                `;
            });
            setHtml('motos-list-container', html || '<p style="text-align:center; color:var(--text-light); font-weight:500;">No hay repartidores registrados.</p>');
        }

        window.rendirPlataMoto = async function(nombre, monto) {
            if(monto <= 0) return showToast("No tiene plata a rendir", "error");
            if(confirm(`¿Recibir $${monto.toLocaleString('es-AR')} de ${nombre}?`)) {
                await _supabase.from('pediloya_logs').insert([{
                    local_id: currentLocalId,
                    tipo: 'RENDICION',
                    metodo: 'EFECTIVO',
                    monto: monto,
                    fecha: getTucumanDateFE(),
                    hora: getTucumanTimeFE(),
                    descripcion: `Rendición de ${nombre}`,
                    moto_asignada: nombre
                }]);
                await loadDataFromDB();
                renderMotosModal();
                showToast("Plata recibida en caja");
            }
        };

        const motoIcon = L.divIcon({
            className: 'custom-div-icon',
            html: '<div style="font-size: 2.8rem; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)); transform: translate(-15px, -20px); animation: pulse-deli 1s infinite alternate;">🛵</div>',
            iconSize: [40, 40],
            iconAnchor: [20, 40]
        });

        window.updateLiveMap = function(lat, lon, containerId, isOwner) {
            let mapVar = isOwner ? radarMap : trackingMap;
            let markerVar = isOwner ? radarMarker : trackingMarker;

            if (!mapVar) {
                mapVar = L.map(containerId, { zoomControl: false }).setView([lat, lon], 16);
                
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap',
                    maxZoom: 19
                }).addTo(mapVar);

                markerVar = L.marker([lat, lon], { icon: motoIcon }).addTo(mapVar);

                if (isOwner) {
                    radarMap = mapVar;
                    radarMarker = markerVar;
                } else {
                    trackingMap = mapVar;
                    trackingMarker = markerVar;
                }
            } else {
                mapVar.setView([lat, lon]);
                markerVar.setLatLng([lat, lon]);
            }
            
            setTimeout(() => mapVar.invalidateSize(), 300);
        };

        window.iniciarRastreoClienteManual = function() {
            let code = qs('track-input-code') ? qs('track-input-code').value.trim().toUpperCase() : '';
            if(!code) return showToast("Ingresá un código de rastreo.", "error");
            
            switchCustomerTab('track', document.querySelectorAll('.nav-item')[1]);
            iniciarRastreoCliente(code, targetLocalName || (qs('public-store-name') ? qs('public-store-name').innerText : ''));
        };

        window.iniciarRastreoCliente = async function(trackCode, localName) {
            if(!trackCode || !localName) return;
            
            let localBusqueda = localName.toUpperCase();
            
            if(!targetLocalId) {
                let { data: usr } = await _supabase.from('pediloya_usuarios').select('id, whatsapp, app_data').eq('local', localBusqueda).maybeSingle();
                if(usr) {
                    targetLocalId = usr.id;
                } else {
                    return showToast("No se encontró el local para el rastreo.", "error");
                }
            }

            if(qs('track-input-code')) qs('track-input-code').value = trackCode;
            
            let resultBox = qs('tracking-result-box');
            if(resultBox) {
                resultBox.classList.remove('hidden');
                setText('track-status-text', 'Buscando repartidor...');
                setText('track-detail-text', `Conectando al sistema...`);
            }

            let { data: pedidos } = await _supabase.from('pediloya_logs')
                .select('*')
                .eq('local_id', targetLocalId)
                .like('descripcion', `%${trackCode}%`);

            let motoDelPedido = null;
            if (pedidos && pedidos.length > 0) {
                let pedidoEncontrado = pedidos.find(p => p.moto_asignada != null);
                if (pedidoEncontrado) motoDelPedido = pedidoEncontrado.moto_asignada;
            }

            if (!motoDelPedido) {
                setText('track-status-text', 'Preparando pedido 🍔');
                setText('track-detail-text', 'Tu pedido se está preparando. Aún no salió.');
                updateLiveMap(-26.8241, -65.2226, 'tracking-map-container', false);
                return;
            }

            setText('track-status-text', `Buscando a ${motoDelPedido}...`);

            let { data: gpsData } = await _supabase.from('pediloya_logs')
                .select('descripcion, hora')
                .eq('local_id', targetLocalId)
                .eq('tipo', 'GPS_DELI')
                .eq('moto_asignada', motoDelPedido) 
                .order('created_at', { ascending: false })
                .limit(1)
                .maybeSingle();

            let initialLat = -26.8241;
            let initialLon = -65.2226;

            if (gpsData && gpsData.descripcion) {
                try {
                    let coords = JSON.parse(gpsData.descripcion);
                    initialLat = coords.lat;
                    initialLon = coords.lon;
                    setText('track-status-text', `🛵 ${motoDelPedido} en camino`);
                    setText('track-detail-text', `Última act: ${gpsData.hora}`);
                } catch(e) {}
            } else {
                setText('track-status-text', `Asignado a ${motoDelPedido}`);
                setText('track-detail-text', 'Esperando GPS del repartidor.');
            }

            updateLiveMap(initialLat, initialLon, 'tracking-map-container', false);

            if(gpsSubscription) {
                _supabase.removeChannel(gpsSubscription);
            }

            gpsSubscription = _supabase.channel('public:pediloya_logs:gps_cliente')
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'pediloya_logs', 
                    filter: `local_id=eq.${targetLocalId}` 
                }, payload => {
                    if(payload.new.tipo === 'GPS_DELI' && payload.new.moto_asignada === motoDelPedido) {
                        try {
                            let coords = JSON.parse(payload.new.descripcion);
                            updateLiveMap(coords.lat, coords.lon, 'tracking-map-container', false);
                            setText('track-status-text', `🛵 ${motoDelPedido} en movimiento`);
                            setText('track-detail-text', `Ubicación en vivo (${payload.new.hora})`);
                        } catch(e) {}
                    }
                }).subscribe();
        };

    </script>
</body>
